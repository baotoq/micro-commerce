min_version = "2026.9.0"

[tools]
# Keep in sync with global.json, which is what the .NET SDK resolver actually reads.
dotnet = "10.0.400"
aspire = "13.6.0"
node = "24"
# Keep in sync with "packageManager" in src/micro-commerce/package.json.
pnpm = "12.4.1"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"
