name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Domain tests
        run: dotnet test -c Release Services/Catalog.API/tests/Domain.Tests/MicroCommerce.Catalog.Domain.Tests.csproj

      - name: Application tests
        run: dotnet test -c Release Services/Catalog.API/tests/Application.Tests/MicroCommerce.Catalog.Application.Tests.csproj

  integration:
    name: Functional & Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Functional tests
        run: dotnet test -c Release Services/Catalog.API/tests/FunctionalTests/MicroCommerce.Catalog.FunctionalTests.csproj

      - uses: actions/cache@v4
        id: cache-dapr
        with:
          path: /usr/local/bin/dapr
          key: dapr-cli-${{ runner.os }}

      - name: Install Dapr CLI
        if: steps.cache-dapr.outputs.cache-hit != 'true'
        run: wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash

      - name: Integration tests
        run: dotnet test -c Release Services/Catalog.API/tests/IntegrationTests/MicroCommerce.Catalog.IntegrationTests.csproj
